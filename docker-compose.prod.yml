# Self-hosted production stack on one machine (README, Deployment, option B): the $0 alternative to the hosted services.
#   cp .env.production.example .env.production       fill in every value marked REQUIRED
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
#   web      Caddy: the single-page app, and /api proxied to the backend on the same origin; TLS for SITE_ADDRESS
#   backend  Spring Boot, prod profile, connected as the restricted runtime role
#   db       PostgreSQL 17 with pgvector, reachable only on the stack's private network
# Redis is not needed: one backend instance keeps its rate limits in memory (ARCHITECTURE.md section 8.1).
name: tech-interviewer-prod

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-interviewer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (.env.production)}
      POSTGRES_DB: ${POSTGRES_DB:-interviewer}
      # The prod profile refuses to run as the superuser this image creates: the application gets its own role (SECURITY.md DB-1),
      # created when the data directory is first initialised (docker/postgres/init).
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:?POSTGRES_APP_USER is required (.env.production)}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required (.env.production)}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./backend/src/main/resources/db/ops:/ops:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    image: tech-interviewer-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-interviewer}
      # The database is on the stack's private network and has no certificate; a hosted database uses require (the default).
      POSTGRES_SSLMODE: disable
      # The owner runs the migrations; the application connects as the runtime role.
      POSTGRES_USER: ${POSTGRES_USER:-interviewer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required in .env.production (openssl rand -base64 48)}"
      # The app and the API share the site's origin; the prod profile still requires the list.
      APP_CORS_ALLOWED_ORIGINS: "${APP_CORS_ALLOWED_ORIGINS:?APP_CORS_ALLOWED_ORIGINS is required in .env.production (the URL of the site)}"
      AI_ENABLED: ${AI_ENABLED:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_FAST_MODEL: ${GEMINI_FAST_MODEL:-gemini-3.5-flash-lite}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-2}
      RAG_ENABLED: ${RAG_ENABLED:-true}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError
    restart: unless-stopped

  web:
    build: ./frontend
    image: tech-interviewer-web
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # A domain name in production (point its DNS at this machine first; Caddy then gets a certificate), :80 to try it locally.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      BACKEND_ADDRESS: backend:8080
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
